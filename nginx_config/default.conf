server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /api/ws/cti {
        resolver 127.0.0.11 valid=30s;
        set $backend_url http://backend-crm:8080;
        proxy_pass $backend_url/api/ws/cti$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /storage {
        resolver 127.0.0.11 valid=30s;
        set $backend_url http://backend-crm:8080;
        proxy_pass $backend_url/storage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_url http://backend-crm:8080;
        proxy_pass $backend_url/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/crm/inbound/play-recording {
        resolver 127.0.0.11 valid=30s;
        set $backend_url http://backend-crm:8080;
        proxy_pass $backend_url/api/crm/inbound/play-recording;
        proxy_hide_header Content-Type;
        add_header Content-Type audio/wav;
        proxy_set_header Host $host;
    }

    location /sounds/ {
        alias /var/lib/asterisk/sounds/custom/;
        add_header Content-Type audio/wav;
        autoindex on;
    }
}